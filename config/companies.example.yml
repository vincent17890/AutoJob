filters:
  title_keywords:
    - Data Scientist
    - Applied Scientist
    - Research Scientist
    - Machine Learning
    - ML Engineer
    - AI Engineer
    - AI Research
    - Software Engineer
    - LLM
    - Generative AI
    - Agent
    - Retrieval
    - Ranking
    - Recommendation
    - Experimentation
    - Causal Inference
    - Forecasting
  description_keywords:
    - machine learning
    - artificial intelligence
    - generative AI
    - large language models
    - LLM
    - agents
    - model evaluation
    - retrieval
    - recommendation systems
    - experimentation
    - causal inference
    - forecasting
    - ML infrastructure
  exclude_keywords:
    - internship
    - intern
    - sales
    - recruiting
    - recruiter
    - nursing
    - warehouse
    - technician
    - customer support
    - marketing
  locations:
    - United States
    - USA
    - US
    - Remote
    - Hybrid
    - California
    - New York
    - Washington
    - Texas
    - Massachusetts
  remote_allowed: true
  employment_types:
    - full-time
    - full time
  seniority_exclude:
    - director
    - vp
    - vice president
    - executive
  allow_internships: false

companies:
  # Replace placeholder ATS identifiers with verified company board slugs.
  - name: Example Greenhouse Company
    slug: example-greenhouse
    enabled: false
    source_type: greenhouse
    ats_identifier: replace-with-greenhouse-board-token
    careers_url: https://www.example.com/careers
    location_filters:
      - United States
      - Remote

  - name: Example Lever Company
    slug: example-lever
    enabled: false
    source_type: lever
    ats_identifier: replace-with-lever-company-token
    careers_url: https://www.example.com/careers

  - name: Example Ashby Company
    slug: example-ashby
    enabled: false
    source_type: ashby
    ats_identifier: replace-with-ashby-organization-slug
    careers_url: https://www.example.com/careers

  # Workday is intentionally unsupported in this MVP because endpoints and payloads
  # vary by tenant. Keep disabled until a company-specific adapter is implemented.
  - name: Example Workday Company
    slug: example-workday
    enabled: false
    source_type: workday
    careers_url: https://www.example.com/careers
