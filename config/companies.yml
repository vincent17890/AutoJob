    - Research Scientist
    - Machine Learning
    - ML Engineer
    - AI Engineer
    - AI Research
    - Software Engineer
    - LLM
    - Generative AI
    - Agent
    - Retrieval
    - Ranking
    - Recommendation
    - Experimentation
    - Causal Inference
    - Forecasting
  description_keywords:
    - machine learning
    - artificial intelligence
    - generative AI
    - large language models
    - LLM
    - agents
    - model evaluation
    - retrieval
    - recommendation systems
    - experimentation
    - causal inference
    - forecasting
    - ML infrastructure
  exclude_keywords:
    - internship
    - intern
    - sales
    - recruiting
    - recruiter
    - nursing
    - warehouse
    - technician
    - customer support
    - marketing
  locations:
    - United States
    - San Jose
    - Sunnyvale
    - Mountain View
    - Palo Alto
  remote_allowed: true
  employment_types:
    - full-time
    - full time
    - FullTime
  seniority_exclude:
    - director
    - vp
    - vice president
    - executive
    - staff
    - manager
    - lead
    - principal
  allow_internships: false

