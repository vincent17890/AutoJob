[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "job-monitor"
version = "0.1.0"
description = "Automated job-posting monitor that writes matched roles to Google Sheets."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Vincent" }
]
dependencies = [
  "google-api-python-client>=2.139.0",
  "google-auth>=2.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-httpx>=0.30.0",
  "ruff==0.16.0",
]

[project.scripts]
job-monitor = "job_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_monitor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
]
ignore = [
  "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
